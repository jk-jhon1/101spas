<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espadas Do Destino— Sandbox 2D Platformer</title>
<style>
:root{--bg:#0a0f1e;--panel:rgba(12,18,38,.92);--line:rgba(255,255,255,.14);--acc:#fbbf24;--txt:#e8ecf8;--mut:#93a0c0;--t1:#10b981;--t2:#0284c7;--t3:#7c3aed;--t4:#d97706;--t5:#dc2626;--t6:#4f46e5}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05070f;color:var(--txt);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;outline:none;image-rendering:pixelated}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud *{pointer-events:none}
#hud #hotbar,#hud #hotbar *{pointer-events:auto}
#hp-wrap{position:absolute;left:14px;top:12px;min-width:220px}
#hp-bar{position:relative;height:22px;width:240px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.55);border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#hp-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b6b,#c0262d);transition:width .12s}
#hp-shield{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(rgba(251,191,36,.85),rgba(217,119,6,.85));mix-blend-mode:screen}
#hp-txt{position:absolute;inset:0;text-align:center;font-size:13px;font-weight:700;line-height:20px;text-shadow:0 1px 2px #000}
#stat-row{margin-top:6px;font-size:12px;color:#dbe4ff;text-shadow:0 1px 2px #000;display:flex;gap:12px;flex-wrap:wrap}
#stat-row b{color:var(--acc)}
#buffs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.buff{font-size:11px;padding:2px 6px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--line)}
#top-right{position:absolute;right:12px;top:12px;text-align:right}
#mini{width:180px;height:110px;border:2px solid rgba(255,255,255,.5);border-radius:6px;background:#05080f;image-rendering:pixelated;display:block;margin-left:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#clock{margin-top:6px;font-size:12px;color:#dbe4ff;text-shadow:0 1px 2px #000}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:rgba(8,12,26,.72);border:1px solid var(--line);border-radius:10px}
.slot{position:relative;width:46px;height:46px;border-radius:7px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:border-color .1s}
.ic{display:inline-block;background-size:contain;background-repeat:no-repeat;background-position:center;flex:none;pointer-events:none}
.slot .ic{width:40px;height:40px}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.slot .key{position:absolute;left:3px;top:0;font-size:10px;color:#cbd5f5;opacity:.8;text-shadow:0 0 2px #000}
.slot.sel{border-color:var(--acc);box-shadow:0 0 10px rgba(251,191,36,.55);background:rgba(251,191,36,.12)}
.slot.t1{border-color:rgba(16,185,129,.55)}.slot.t2{border-color:rgba(2,132,199,.7)}.slot.t3{border-color:rgba(124,58,237,.75)}.slot.t4{border-color:rgba(217,119,6,.8)}.slot.t5{border-color:rgba(220,38,38,.8)}.slot.t6{border-color:rgba(99,102,241,.95);box-shadow:inset 0 0 8px rgba(251,191,36,.35)}
.slot.sel.t1,.slot.sel.t2,.slot.sel.t3,.slot.sel.t4,.slot.sel.t5,.slot.sel.t6{border-color:var(--acc)}
.slot.empty .ic{display:none}
.slot:hover{background:rgba(255,255,255,.14)}
#item-name{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);font-size:14px;font-weight:700;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}
#bossbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(520px,60vw);text-align:center}
#boss-name{font-size:14px;font-weight:800;letter-spacing:.5px;text-shadow:0 1px 3px #000;margin-bottom:3px}
#boss-wrap{height:16px;border:2px solid rgba(255,255,255,.6);border-radius:8px;background:rgba(0,0,0,.6);overflow:hidden}
#boss-fill{height:100%;background:linear-gradient(#f87171,#b91c1c);transition:width .1s}
#toasts{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(760px,90vw)}
.toast{padding:7px 14px;border-radius:8px;background:rgba(8,12,26,.82);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:center;text-shadow:0 1px 2px #000;animation:tin .25s ease-out,tout .5s ease-in forwards;animation-delay:0s,var(--d,3s)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#dps{position:absolute;left:14px;top:120px;font-size:13px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
#dbg{position:absolute;left:14px;bottom:80px;font:11px monospace;color:#9fe;text-shadow:0 1px 2px #000;white-space:pre}
#deadmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(transparent,rgba(120,0,0,.55));font-size:44px;font-weight:900;letter-spacing:2px;color:#fecaca;text-shadow:0 3px 12px #000}
#deadmsg small{font-size:16px;font-weight:600;margin-top:8px;color:#fda4af}
/* ---------- painéis ---------- */
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 50px rgba(0,0,0,.65);backdrop-filter:blur(6px);color:var(--txt)}
.panel h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
#panel-inv{left:50%;top:50%;transform:translate(-50%,-50%);padding:14px;display:flex;gap:16px;max-height:92vh;max-width:96vw}
#inv-left{width:330px;display:flex;flex-direction:column}
#inv-right{display:flex;flex-direction:column;gap:10px}
#inv-grid{display:grid;grid-template-columns:repeat(10,46px);gap:4px}
#equip-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#equip-row .lbl{font-size:11px;color:var(--mut);margin-right:4px}
.slot.eq{background:rgba(251,191,36,.07)}
.slot.trash{border-style:dashed;opacity:.8}
#chest-wrap{display:none}
#chest-grid{display:grid;grid-template-columns:repeat(10,46px);gap:4px}
#coins{font-size:13px;color:var(--acc);font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:4px 9px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;color:var(--mut);pointer-events:auto}
.tab.on{background:var(--acc);color:#1b1305;border-color:var(--acc);font-weight:700}
.tab:hover{background:rgba(255,255,255,.16)}.tab.on:hover{background:var(--acc)}
#craft-search{width:100%;padding:6px 9px;margin-bottom:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;font-size:13px;-webkit-user-select:text;user-select:text;outline:none}
#craft-list{overflow-y:auto;flex:1;min-height:150px;max-height:62vh;padding-right:4px}
#craft-list::-webkit-scrollbar,#ars-body::-webkit-scrollbar{width:8px}#craft-list::-webkit-scrollbar-thumb,#ars-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
.rec{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;border:1px solid transparent;cursor:pointer;margin-bottom:2px}
.rec:hover{background:rgba(255,255,255,.1);border-color:var(--line)}
.rec.no{opacity:.45}
.rec .ic.big{width:34px;height:34px}
.rec .nm{font-size:13px;font-weight:700;line-height:1.15}
.rec .ing{font-size:11px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec .ing span{display:inline-flex;align-items:center;gap:2px}.rec .ing .ic{width:14px;height:14px}.rec .ing .miss{color:#f87171}
.rec .st{font-size:10px;padding:1px 5px;border-radius:8px;background:rgba(251,191,36,.18);color:var(--acc)}
#panel-arsenal{left:50%;top:50%;transform:translate(-50%,-50%);padding:14px;width:min(1020px,96vw);max-height:92vh;display:flex;flex-direction:column}
#ars-body{overflow-y:auto;padding-right:6px;flex:1}
.ars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.ars-grid .slot{width:100%;height:52px}.ars-grid .slot .ic{width:44px;height:44px}
.ars-grid .slot .num{position:absolute;left:3px;top:1px;font-size:9px;color:#cbd5f5;opacity:.75}
.ars-grid .slot.novo::after{content:"★";position:absolute;right:3px;top:0;font-size:10px;color:#fbbf24}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.btn{padding:7px 14px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;pointer-events:auto}
.btn:hover{background:rgba(255,255,255,.2)}.btn.pri{background:var(--acc);color:#1b1305;border-color:var(--acc)}.btn.pri:hover{filter:brightness(1.08);background:var(--acc)}.btn.on{background:#16a34a;border-color:#16a34a}
.enemy-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;margin:3px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px;cursor:pointer}.enemy-btn:hover{background:rgba(255,255,255,.2)}
.sect{margin:10px 0 6px;font-size:12px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
#tooltip{position:fixed;z-index:60;max-width:330px;padding:10px 12px;background:rgba(6,9,20,.96);border:1px solid var(--line);border-radius:9px;font-size:12.5px;line-height:1.4;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#tooltip .tn{font-size:15px;font-weight:800}
#tooltip .ts{font-size:11px;color:var(--mut);margin-bottom:6px}
#tooltip .st2{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:5px 0}
#tooltip .st2 b{color:#fff}
#tooltip .mech{color:#dfe7ff;margin-top:4px;font-style:italic}
#tooltip .rcp{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px}
#tooltip .tag{display:inline-block;margin-top:6px;padding:1px 7px;border-radius:9px;font-size:10px;background:rgba(251,191,36,.18);color:var(--acc)}
#tooltip .tag.pdf{background:rgba(16,185,129,.18);color:#6ee7b7}
#cursor-item{position:fixed;z-index:70;width:44px;height:44px;pointer-events:none}
#cursor-item .ic{width:44px;height:44px}#cursor-item .cnt{position:absolute;right:0;bottom:-2px;font-size:12px;font-weight:700;text-shadow:0 0 3px #000}
/* ---------- telas ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40}
#menu{background:radial-gradient(ellipse at 50% 45%,rgba(5,8,20,.45),rgba(5,8,20,.2) 55%,rgba(5,8,20,.55));gap:6px}
#menu-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}
#logo{font-size:min(8.2vw,86px);font-weight:900;letter-spacing:3px;line-height:1;text-align:center;background:linear-gradient(#fff7c2,#fbbf24 55%,#b45309);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(251,191,36,.35))}
#logo small{display:block;font-size:.3em;letter-spacing:7px;margin-top:6px;background:linear-gradient(90deg,#10b981,#0284c7,#7c3aed,#d97706,#dc2626,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
#tiers-strip{display:flex;gap:6px;margin:12px 0 18px}
#tiers-strip span{width:46px;height:8px;border-radius:4px}
.menu-btn{width:min(340px,80vw);padding:13px 18px;margin:5px;font-size:17px;font-weight:800;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:linear-gradient(rgba(12,18,44,.82),rgba(12,18,44,.66));color:#fff;letter-spacing:.5px;text-shadow:0 1px 3px #000;transition:transform .08s,border-color .1s,background .1s;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.menu-btn:hover{transform:translateY(-2px);border-color:var(--acc);background:linear-gradient(rgba(70,48,10,.9),rgba(40,28,8,.8))}
.menu-btn small{display:block;font-size:11px;font-weight:500;color:#dbe4ff;letter-spacing:0;margin-top:2px}
#seed-row{margin-top:8px;font-size:12px;color:#dbe4ff;text-shadow:0 1px 3px #000;display:flex;gap:8px;align-items:center}
#seed{width:150px;padding:5px 8px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:6px;color:#fff;font:inherit;-webkit-user-select:text;user-select:text;outline:none}
#loading{background:radial-gradient(circle at 50% 40%,#142046,#05070f);gap:14px}
#load-title{font-size:26px;font-weight:800;color:var(--acc)}
#load-bar{width:min(480px,80vw);height:16px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid var(--line);overflow:hidden}
#load-fill{height:100%;width:0;background:linear-gradient(90deg,#10b981,#0284c7,#7c3aed,#d97706,#dc2626);transition:width .1s}
#load-msg{font-size:14px;color:var(--mut)}#load-tip{font-size:13px;color:#cbd5f5;max-width:520px;text-align:center;min-height:36px}
#pause,#help{background:rgba(3,5,12,.72);gap:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:min(760px,94vw);max-height:90vh;overflow:auto;line-height:1.55;font-size:14px;pointer-events:auto}
.box h2{margin:0 0 10px;color:var(--acc)}.box kbd{background:rgba(255,255,255,.14);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:12px monospace}
.box table{border-collapse:collapse;width:100%}.box td{padding:3px 8px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}.box td:first-child{white-space:nowrap;color:#fff}
#npc-panel{left:50%;top:50%;transform:translate(-50%,-50%);padding:16px;width:min(480px,94vw)}
.shop-row{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;cursor:pointer}.shop-row:hover{background:rgba(255,255,255,.1)}.shop-row .ic{width:34px;height:34px}
/* controle (gamepad): foco nos menus, cursor virtual nos painéis e dica no título */
.menu-btn.padfocus{transform:translateY(-2px);border-color:var(--acc);background:linear-gradient(rgba(70,48,10,.9),rgba(40,28,8,.8));outline:2px solid #fde68a;outline-offset:3px}
#pad-hint{margin-top:6px;font-size:11px;color:#c7d2fe;opacity:.85;text-shadow:0 1px 3px #000}
#pad-cursor{position:fixed;left:0;top:0;width:26px;height:26px;z-index:90;pointer-events:none;display:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.85));background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M2 2 L2 20 L7 15.5 L11 24 L15 22 L11 14 L18 14 Z' fill='%23fff' stroke='%23000' stroke-width='1.6' stroke-linejoin='round'/></svg>") no-repeat}
#pad-cursor.on{display:block}
@media (max-height:640px){.slot{width:40px;height:40px}.slot img{width:34px;height:34px}#inv-grid{grid-template-columns:repeat(10,40px)}}

</style>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>

  <div id="hud" class="hidden">
    <div id="hp-wrap">
      <div id="hp-bar"><div id="hp-fill"></div><div id="hp-shield"></div><div id="hp-txt"></div></div>
      <div id="stat-row"></div>
      <div id="buffs"></div>
    </div>
    <div id="top-right"><canvas id="mini" width="180" height="110"></canvas><div id="clock"></div></div>
    <div id="bossbar" class="hidden"><div id="boss-name"></div><div id="boss-wrap"><div id="boss-fill"></div></div></div>
    <div id="toasts"></div>
    <div id="dps" class="hidden"></div>
    <div id="dbg" class="hidden"></div>
    <div id="item-name"></div>
    <div id="hotbar"></div>
    <div id="deadmsg" class="hidden"><div>VOCÊ FOI MOGADO</div><small id="dead-sub"></small></div>
  </div>

  <div id="panel-inv" class="panel hidden">
    <div id="inv-left">
      <h3><span>Criação</span><span id="station-info" style="text-transform:none;letter-spacing:0"></span></h3>
      <input id="craft-search" placeholder="Buscar receita..." autocomplete="off">
      <div class="tabs" id="craft-tabs"></div>
      <div id="craft-list"></div>
    </div>
    <div id="inv-right">
      <h3><span>Inventário</span><span id="coins"></span></h3>
      <div id="inv-grid"></div>
      <div id="equip-row"></div>
      <div id="chest-wrap"><h3 style="margin-top:6px"><span>Baú</span></h3><div id="chest-grid"></div></div>
      <div style="font-size:11px;color:var(--mut);line-height:1.5">Clique: pegar/colocar · Botão direito: metade/um · Shift+clique: mover rápido/equipar · Solte na lixeira para destruir</div>
    </div>
  </div>

  <div id="panel-arsenal" class="panel hidden">
    <h3><span id="ars-title">Arsenal</span><span><button class="btn" id="ars-close">Fechar (B)</button></span></h3>
    <div class="tabs" id="ars-tabs"></div>
    <div id="ars-body"></div>
  </div>

  <div id="npc-panel" class="panel hidden"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="cursor-item" class="hidden"></div>

  <div id="menu" class="screen">
    <canvas id="menu-bg"></canvas>
    <div id="logo">ESPADAS DO DESTINO<small>SANDBOX 2D PLATFORMER</small></div>
    <div id="tiers-strip"></div>
    <button class="menu-btn hidden" id="btn-load">Continuar Jogo<small>Carregar o mundo salvo</small></button>
    <button class="menu-btn" id="btn-adv">Nova Aventura<small>Mine, crie, derrote chefes e forje as 120 espadas</small></button>
    <button class="menu-btn" id="btn-cre">Modo Criativo<small>Arsenal completo: todas as espadas, inimigos e bonecos de treino</small></button>
    <button class="menu-btn" id="btn-help">Controles e Guia</button>
    <div id="seed-row"><label for="seed">Semente do mundo:</label><input id="seed" placeholder="aleatória" maxlength="20" autocomplete="off"></div>
    <div id="pad-hint">Aceita controle (gamepad): aperte um botão para ativar</div>
  </div>

  <div id="loading" class="screen hidden">
    <div id="load-title">Gerando mundo...</div>
    <div id="load-bar"><div id="load-fill"></div></div>
    <div id="load-msg"></div>
    <div id="load-tip"></div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="box" style="text-align:center;min-width:300px">
      <h2>Pausado</h2>
      <button class="menu-btn" id="p-resume" style="font-size:15px">Continuar</button>
      <button class="menu-btn" id="p-help" style="font-size:15px">Controles e Guia</button>
      <button class="menu-btn" id="p-sound" style="font-size:15px">Som: ligado</button>
      <button class="menu-btn" id="p-save" style="font-size:15px">Salvar jogo</button>
      <button class="menu-btn" id="p-menu" style="font-size:15px">Salvar e voltar ao menu</button>
    </div>
  </div>

  <div id="help" class="screen hidden"><div class="box" id="help-box"></div></div>
</div>
<script>
'use strict';
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const chance = p => Math.random() < p;
const sgn = v => v < 0 ? -1 : 1;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const smooth = t => t * t * (3 - 2 * t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const approach = (v, target, d) => v < target ? Math.min(v + d, target) : Math.max(v - d, target);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const deg = d => d * PI / 180;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

;
const WW = 1400, WH = 480, CHUNK = 32, SEA = 126;
const Y_SKY = 92, Y_DEEP = 300, Y_HELL = 405;
const SKY_SCAN_Y = 78;   // exposição ao céu é medida só abaixo da faixa das ilhas flutuantes

const SOLID = new Uint8Array(256), FALLS = new Uint8Array(256), OPAC = new Float32Array(256);
for (const d of TD) { SOLID[d.id] = d.s ? 1 : 0; FALLS[d.id] = d.fall ? 1 : 0; OPAC[d.id] = d.o; }
const LIQ_WATER = 1, LIQ_LAVA = 2;

class World {
  constructor(w = WW, h = WH, seed = 1) {
    this.w = w; this.h = h; this.seed = seed;
    const n = w * h;
    this.t = new Uint8Array(n);        // tiles (frente)
    this.wl = new Uint8Array(n);       // paredes (fundo)
    this.lq = new Uint8Array(n);       // quantidade de líquido (0..255)
    this.lt = new Uint8Array(n);       // tipo de líquido
    this.skyTop = new Int16Array(w);   // primeiro y com bloco/parede (exposição ao céu)
    this.surf = new Int16Array(w);     // superfície gerada
    this.bio = new Uint8Array(w);      // bioma por coluna
    this.rev = new Uint8Array(n);      // revelado no mapa
    this.chests = new Map();           // idx -> slots
    this.liqAct = new Set(); this.sandAct = new Set();
    this.spawn = { x: 0, y: 0 };
    this.hardmode = false;
    this.onBreak = null;               // callback(x,y,tileId) para drops de objetos soltos
    this.onTile = null;                // callback(x,y) quando um tile muda (mapa)
    this.chunkAct = new Uint8Array(Math.ceil(w / CHUNK) * Math.ceil(h / CHUNK));
  }
  idx(x, y) { return x + y * this.w; }
  inb(x, y) { return x >= 0 && x < this.w && y >= 0 && y < this.h; }
  get(x, y) { if (x < 0 || x >= this.w || y >= this.h) return T.bedrock; if (y < 0) return 0; return this.t[x + y * this.w]; }
  solid(x, y) { return SOLID[this.get(x, y)] === 1; }
  wallAt(x, y) { return (x < 0 || x >= this.w || y < 0 || y >= this.h) ? 0 : this.wl[x + y * this.w]; }
  liqAt(x, y) { return (x < 0 || x >= this.w || y < 0 || y >= this.h) ? 0 : this.lq[x + y * this.w]; }
  liqType(x, y) { return (x < 0 || x >= this.w || y < 0 || y >= this.h) ? 0 : this.lt[x + y * this.w]; }
  biomeName(x) { return ['ocean', 'desert', 'forest', 'jungle', 'snow'][this.bio[clamp(x | 0, 0, this.w - 1)]]; }
  layerAt(x, y) {
    if (y < Y_SKY) return 'sky';
    if (y >= Y_HELL) return 'hell';
    if (y >= Y_DEEP) return 'deep';
    const s = this.surf[clamp(x | 0, 0, this.w - 1)];
    if (y < s + 14) return 'surface';
    return 'cave';
  }

  _recalcSky(x, y0) {
    const w = this.w, h = this.h; let y = Math.max(y0, SKY_SCAN_Y);
    while (y < h && !(SOLID[this.t[x + y * w]] || this.wl[x + y * w])) y++;
    this.skyTop[x] = y;
  }
  set(x, y, id, quiet) {
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
    const w = this.w, i = x + y * w, old = this.t[i];
    if (old === id) return;
    this.t[i] = id;
    if (SOLID[id] && this.lq[i]) { this.lq[i] = 0; this.lt[i] = 0; }
    if (y >= SKY_SCAN_Y) { if (SOLID[id] || this.wl[i]) { if (y < this.skyTop[x]) this.skyTop[x] = y; } else if (y === this.skyTop[x]) this._recalcSky(x, y + 1); }
    if (this.onTile) this.onTile(x, y);
    if (quiet) return;
    this.wakeLiq(x, y);
    if (FALLS[id]) this.sandAct.add(i);
    if (y > 0 && FALLS[this.t[i - w]]) this.sandAct.add(i - w);
    this.checkSupport(x, y - 1);
    if (!SOLID[id]) this.checkSupport(x, y);
  }
  setWall(x, y, id) {
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
    const i = x + y * this.w; if (this.wl[i] === id) return;
    this.wl[i] = id;
    if (y >= SKY_SCAN_Y) { if (id) { if (y < this.skyTop[x]) this.skyTop[x] = y; } else if (y === this.skyTop[x] && !SOLID[this.t[i]]) this._recalcSky(x, y + 1); }
    if (this.onTile) this.onTile(x, y);
  }
  wakeLiq(x, y) {
    const w = this.w;
    for (let k = 0; k < 5; k++) {
      const nx = x + (k === 1 ? -1 : k === 2 ? 1 : 0), ny = y + (k === 3 ? -1 : k === 4 ? 1 : 0);
      if (nx < 0 || ny < 0 || nx >= w || ny >= this.h) continue;
      if (this.lq[nx + ny * w]) this.liqAct.add(nx + ny * w);
    }
  }
  // apoio: plantas e objetos exigem chão sólido abaixo
  checkSupport(x, y) {
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
    const id = this.t[x + y * this.w], d = TD[id];
    if (id === 0) return;
    const below = this.get(x, y + 1);
    let broken = false;
    if (d.plant) {
      if (id === T.cactus) broken = !(below === T.sand || below === T.cactus || below === T.sandstone);
      else broken = !SOLID[below];
    } else if (d.obj) broken = !SOLID[below];
    else if (d.door) broken = !(SOLID[below] || TD[below].door);
    else if (id === T.trunk) broken = !(SOLID[below] || below === T.trunk);
    if (broken) { if (this.onBreak) this.onBreak(x, y, id); if (id === T.trunk) this.fellTree(x, y, true); else this.set(x, y, 0); }
  }
  // derruba a árvore a partir de um tronco (retorna madeira)
  fellTree(x, y, silent) {
    let wood = 0;
    let top = y; while (this.get(x, top - 1) === T.trunk) top--;
    for (let yy = y; yy >= top; yy--) { if (this.get(x, yy) === T.trunk) { this.set(x, yy, 0, true); wood += rndi(1, 3); } }
    const seen = new Set(), q = [];
    const isLeaf = id => TD[id].tree && id !== T.trunk;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -2; dy <= 1; dy++) { const nx = x + dx, ny = top + dy; if (isLeaf(this.get(nx, ny))) { q.push([nx, ny]); seen.add(nx + ny * this.w); } }
    while (q.length && seen.size < 260) {
      const [cx, cy] = q.pop(); this.set(cx, cy, 0, true);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy, k = nx + ny * this.w;
        if (!seen.has(k) && Math.abs(nx - x) <= 6 && ny <= top + 2 && ny >= top - 9 && isLeaf(this.get(nx, ny))) { seen.add(k); q.push([nx, ny]); }
      }
    }
    this.checkSupport(x, y + 1);
    if (!silent && this.onBreak) { /* drops tratados pelo chamador */ }
    return wood;
  }
  // porta: coluna de 3 tiles
  doorColumn(x, y) {
    let top = y; while (TD[this.get(x, top - 1)].door) top--;
    let bot = y; while (TD[this.get(x, bot + 1)].door) bot++;
    return [top, bot];
  }
  toggleDoor(x, y) {
    const [a, b] = this.doorColumn(x, y), open = this.get(x, y) === T.doorC;
    for (let yy = a; yy <= b; yy++) this.set(x, yy, open ? T.doorO : T.doorC, true);
  }

  // ---------- simulação de fluidos (autômato celular) ----------
  stepLiquids(budget = 4000) {
    const w = this.w, h = this.h, lq = this.lq, lt = this.lt, t = this.t;
    if (!this.liqAct.size) return 0;
    const cur = Array.from(this.liqAct).slice(0, budget);
    for (const i of cur) this.liqAct.delete(i);
    let changed = 0;
    for (const i of cur) {
      let amt = lq[i]; if (!amt) continue;
      const x = i % w, y = (i / w) | 0, ty = lt[i];
      if (y >= h - 1) continue;
      // cair
      const bi = i + w;
      if (!SOLID[t[bi]]) {
        const bt = lt[bi], bamt = lq[bi];
        if (bamt === 0 || bt === ty) {
          const mv = Math.min(amt, 255 - bamt);
          if (mv > 0) { lq[bi] = bamt + mv; lt[bi] = ty; amt -= mv; lq[i] = amt; if (!amt) lt[i] = 0; this.liqAct.add(bi); changed++; this._wakeAround(x, y); }
        } else if (bamt > 0 && bt !== ty) { this._react(i, bi, ty); continue; }
      }
      if (amt <= 0) continue;
      // espalhar
      const dirs = Math.random() < .5 ? [-1, 1] : [1, -1];
      for (const dx of dirs) {
        const nx = x + dx; if (nx < 0 || nx >= w) continue;
        const ni = i + dx;
        if (SOLID[t[ni]]) continue;
        const namt = lq[ni], nt = lt[ni];
        if (namt > 0 && nt !== ty) { this._react(i, ni, ty); amt = lq[i]; if (!amt) break; continue; }
        // só espalha se estiver apoiado (abaixo sólido ou líquido) ou cheio
        const diff = amt - namt;
        if (diff > 2) {
          const mv = (diff + 1) >> 1;
          lq[ni] = namt + mv; lt[ni] = ty; amt -= mv; lq[i] = amt; if (!amt) lt[i] = 0;
          this.liqAct.add(ni); this.liqAct.add(i); changed++;
          if (amt <= 0) break;
        }
      }
    }
    return changed;
  }
  _wakeAround(x, y) { const w = this.w; if (y > 0 && this.lq[x + (y - 1) * w]) this.liqAct.add(x + (y - 1) * w); if (x > 0 && this.lq[x - 1 + y * w]) this.liqAct.add(x - 1 + y * w); if (x < w - 1 && this.lq[x + 1 + y * w]) this.liqAct.add(x + 1 + y * w); }
  _react(i, j, ty) { // água + lava = obsidiana (no tile da lava)
    const lavaI = ty === LIQ_LAVA ? i : j, waterI = ty === LIQ_LAVA ? j : i;

   11_swords: CATÁLOGO MESTRE — 120 espadas (schema SwordItemSO)
   Tiers 1, 3 e 5: textos originais do GDD (src:'pdf').
   Tiers 2, 4 e 6: o PDF veio truncado -> criadas seguindo as
   regras de cada tier (src:'novo').
   Campos: swordID, swordName, tierLevel, baseDamage, attackSpeed,
   knockbackForce, critChance, projectilePrefab, attackType,
   passiveEffects[], OnSwing(combat, dir), OnHitEnemy(enemy, info)
   ============================================================ */
const SWORDS = [], SWORD_BY_NUM = {};
const LK = (sh, col, len, o) => Object.assign({ sh, col, len }, o || {});
const DEF_CRIT = { 1: .04, 2: .05, 3: .06, 4: .07, 5: .08, 6: .10 };

function S(num, name, d, v, k, look, fx, txt, rec, o) {
  o = o || {}; const t = Math.ceil(num / 20), id = 's' + String(num).padStart(3, '0');
  const sw = {
    swordID: num, num, id, swordName: name, tierLevel: t, baseDamage: d, attackSpeed: v, knockbackForce: k,
    critChance: o.crit !== undefined ? o.crit : DEF_CRIT[t], projectilePrefab: o.prefab || (fx.length ? 'Proj_' + id : null),
    attackType: o.atk || 'ArcSwing', passiveEffects: fx, look, txt, src: (t % 2 === 1) ? 'pdf' : 'novo', station: o.st || TIER_STATION[t],
    // métodos virtuais do SwordItemSO
    OnSwing(combat, dir) { const P = G.P; if (P && combat) fxCall(this, 'onSwing', P, combat, dir); },
    OnHitEnemy(enemy, info) { const P = G.P; if (P) fxCall(this, 'onHit', P, enemy, info.h || {}, info); },
  };
  sw.dps = d * v;
  fx.forEach(f => f.init && f.init(sw));

  SWORDS.push(sw); SWORD_BY_NUM[num] = sw;
  IT[id] = { id, n: name, type: 'sword', tier: t, stack: 1, sw, ic: ['sword', sw], desc: txt };
  RECIPES.push({ out: id, n: 1, ing, st: sw.station });

}

/* ===== 12_player.js ===== */
/* ============================================================
   12_player: jogador, inventário, crafting, mineração, blocos
   ============================================================ */
const INV_N = 40, KEYS = {}, PLAYER_W = 12, PLAYER_H = 26;
function newPlayer() {
  return {
    x: 0, y: 0, w: PLAYER_W, h: PLAYER_H, vx: 0, vy: 0, onGround: false, face: 1, hp: 100, maxHp: 100, crystals: 0, inv_: 0, inv: new Array(INV_N).fill(null), sel: 0,
    equip: { armor: null, acc: [null, null, null] }, stats: { def: 0, dmg: 0, crit: 0, cm: 1, spd: 0, steal: 0, kbr: 0, hp: 0 },
    cb: { cd: 0, side: 1, count: 0, inst: [], sw: null, hits: 0, swingT: 0, blockT: 0, blockPct: 0, main: null, lastHitT: 0 },
    buffs: {}, mine: { x: -1, y: -1, p: 0, t: 0 }, anim: { walk: 0, arm: 0 }, coyote: 0, jbuf: 0, kbT: 0, flash: 0, dead: false, respawnT: 0,
    potionCd: 0, fallStart: 0, inWater: false, inLava: false, slowfall: 0, placeT: 0, dmgInv: 0, lavaT: 0, lastCrystalMsg: 0, atkAim: 0, jumpHeld: false,
  };
}
// P.inv = slots do inventário | P.inv_ = timer de invulnerabilidade (i-frames do jogador)

// ---------- inventário ----------
function invDirty() { G.invChanged = true; }
function stackMax(id) { return IT[id].stack || STACK_MAX; }
function invCanAdd(id, n) {
  const P = G.P, sm = stackMax(id);
  for (const s of P.inv) { if (!s) return true; if (s.id === id && s.n < sm) return true; }
  return false;
}
function invAdd(id, n, meta) {
  const P = G.P, sm = stackMax(id);
  if (sm > 1) for (const s of P.inv) { if (s && s.id === id && s.n < sm) { const k = Math.min(n, sm - s.n); s.n += k; n -= k; if (n <= 0) break; } }
  while (n > 0) {
    const i = P.inv.indexOf(null); if (i < 0) break;
    const k = Math.min(n, sm); P.inv[i] = { id, n: k, m: meta || null }; n -= k;
  }
  invDirty(); if (IT[id].type === 'sword' || IT[id].type === 'pick') recalcStats();
  return n;
}
function invCount(id) { let c = 0; for (const s of G.P.inv) if (s && s.id === id) c += s.n; return c; }
function invRemove(id, n) {
  const P = G.P; if (invCount(id) < n) return false;
  for (let i = INV_N - 1; i >= 0 && n > 0; i--) { const s = P.inv[i]; if (s && s.id === id) { const k = Math.min(n, s.n); s.n -= k; n -= k; if (s.n <= 0) P.inv[i] = null; } }
  invDirty(); return true;
}
function heldItem() { return G.P.inv[G.P.sel]; }
function heldSword() { const s = heldItem(); return s && IT[s.id].type === 'sword' ? IT[s.id].sw : null; }

// ---------- estações e crafting ----------
let _stCache = { t: -1, set: null };
function nearStations() {
  if (_stCache.t === Math.floor(G.t * 4)) return _stCache.set;
  const P = G.P, wd = G.world, cx = Math.floor((P.x + P.w / 2) / TS), cy = Math.floor((P.y + P.h / 2) / TS), set = new Set();
  for (let y = cy - 4; y <= cy + 3; y++) for (let x = cx - 6; x <= cx + 6; x++) { const d = TD[wd.get(x, y)]; if (d.st) STATION_SAT[d.st].forEach(k => set.add(k)); }
  _stCache = { t: Math.floor(G.t * 4), set }; return set;
}
function canCraft(r) {
  if (G.mode === 'creative' && G.opts.freeCraft) return true;
  if (r.st && !nearStations().has(r.st)) return false;
  for (const k in r.ing) if (invCount(k) < r.ing[k]) return false;
  return true;
}
function missingStation(r) { return r.st && !nearStations().has(r.st); }
function doCraft(r) {
  if (!canCraft(r)) return false;
  const free = G.mode === 'creative' && G.opts.freeCraft;
  if (!free) for (const k in r.ing) invRemove(k, r.ing[k]);
  const left = invAdd(r.out, r.n);
  if (left > 0) dropItem(r.out, left, G.P.x, G.P.y);
  sfx('craft'); return true;
}

// ---------- equipamentos / estatísticas ----------
function recalcStats() {
  const P = G.P, st = { def: 0, dmg: 0, crit: 0, cm: 1, spd: 0, steal: 0, kbr: 0, hp: 0 };
  const ar = P.equip.armor; if (ar) st.def += IT[ar.id].def;
  for (const a of P.equip.acc) if (a) { const s = IT[a.id].acc; st.dmg += s.dmg || 0; st.crit += s.crit || 0; st.cm += s.cm || 0; st.spd += s.spd || 0; st.steal += s.steal || 0; st.def += s.def || 0; st.kbr += s.kbr || 0; st.hp += s.hp || 0; }
  const sw = heldSword(); P.cb.sw = sw;
  if (sw) fxCall(sw, 'stats', P, st);
  P.stats = st;
  const mh = Math.min(400, 100 + P.crystals * 20) + st.hp; P.maxHp = mh; if (P.hp > mh) P.hp = mh;
}
function equipFromInv(slot) {
  const P = G.P, s = P.inv[slot]; if (!s) return false; const it = IT[s.id];
  if (it.type === 'armor') { const old = P.equip.armor; P.equip.armor = { id: s.id, n: 1 }; P.inv[slot] = old; }
  else if (it.type === 'acc') {
    let i = P.equip.acc.indexOf(null); if (i < 0) i = 0; const old = P.equip.acc[i]; P.equip.acc[i] = { id: s.id, n: 1 }; P.inv[slot] = old;
  } else return false;
  invDirty(); recalcStats(); sfx('place'); return true;
}

// ---------- tiles: quebrar / colocar ----------
function tileDropFor(id, x, y) {
  const d = TD[id];
  if (id === T.trunk) return ['wood', rndi(1, 3)];
  if (d.d) return [d.d, id === T.coal ? rndi(1, 2) : 1];

function render() {

  if (!P.dead) drawPlayer(sctx, P);

  for (const e of G.enemies) if (!e.dead && inView(ecx(e), ecy(e), 120)) drawEnemyGlow(vctx, e);

  if (P.inLava || (P.inv_ > .3 && !P.dead)) { const a = P.inLava ? .22 : .18 * clamp((P.inv_ - .3) * 2, 0, 1); vctx.fillStyle = P.inLava ? 'rgba(255,90,20,' + a + ')' : 'rgba(255,0,0,' + a + ')'; vctx.fillRect(0, 0, w, h); }
  else if (P.inWater) { vctx.fillStyle = 'rgba(30,80,200,.16)'; vctx.fillRect(0, 0, w, h); }

}
// menu animado
const _menuSwords = [];
function renderMenuBg() {
  const mb = $('menu-bg'), g = mb.getContext('2d'), w = mb.width, h = mb.height, t = performance.now() / 1000;
  if (!SKY.clouds) initSky(7); const frac = .18 + Math.sin(t * .05) * .02;
  drawSky(g, w, h, t * 30, 1850 + 40, .8, frac, 'forest', t);
  if (!_menuSwords.length) for (let i = 0; i < 26; i++) _menuSwords.push({ id: SWORDS[(i * 5 + 3) % 120].id, x: Math.random(), y: Math.random(), s: .3 + Math.random() * .7, a: Math.random() * TAU, v: (Math.random() - .5) * .6, sp: .01 + Math.random() * .02 });
  g.imageSmoothingEnabled = false;
  for (const s of _menuSwords) { s.x += s.sp * .016; if (s.x > 1.1) s.x = -.1; const c = iconCanvas(s.id); g.save(); g.globalAlpha = .35 + .35 * s.s; g.translate(s.x * w, (s.y * .8 + .1) * h + Math.sin(t * s.s + s.a) * 8); g.rotate(s.a + t * s.v); const sz = 26 + s.s * 34; g.drawImage(c, -sz / 2, -sz / 2, sz, sz); g.restore(); }

// ---------- loop ----------
let _last = performance.now();

function initGame() {

initGame();
